# Finnegan global configuration
# Directory layout is TBD — fill these in once the structure is designed.

# Directories monitored by the global watcher (recursive). Supports "~".
watch_dirs: []

# Where thoughts captured from the Omnibar are written.
# Empty = fall back to the first entry of watch_dirs.
inbox_dir: ""

# Per-file debounce window for filesystem events (ms).
debounce_ms: 300

# Max concurrent bugu radar runs; extra requests queue up.
bugu_max_concurrency: 1
